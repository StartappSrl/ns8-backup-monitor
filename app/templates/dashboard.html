<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="csrf-token" content="{{ csrf_token() }}" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Report backup — Backup Monitor</title>
<style>
  :root{
    --bg:#F2F4F7; --panel:#FFFFFF; --panel-2:#F8F9FB; --border:#DDE2E9;
    --text:#1B222C; --text-muted:#5B6472; --text-faint:#8A93A1; --accent:#3B6FD1;
    --critical:#C43D3D; --critical-bg:#FBEAEA; --warning:#A9700F; --warning-bg:#FBF1DE;
    --ok:#237A50; --ok-bg:#E6F5EC; --info:#3B6FD1; --info-bg:#EAF0FC;
    font-family:'IBM Plex Sans', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161D; --panel:#1A2029; --panel-2:#1F2530; --border:#2A313D;
      --text:#E7ECF2; --text-muted:#9AA4B2; --text-faint:#6C7686; --accent:#6C97F5;
      --critical:#F0555C; --critical-bg:#3A1E20; --warning:#F0AC3D; --warning-bg:#3A2E16;
      --ok:#3ED98B; --ok-bg:#163A29; --info:#6C97F5; --info-bg:#182848;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  .mono{font-family:'IBM Plex Mono', monospace;}
  header{
    border-bottom:1px solid var(--border); background:var(--panel);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px; height:30px; border-radius:7px;
    background:linear-gradient(135deg, var(--accent), #7756D9);
    display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:13px;
  }
  .brand h1{font-size:15px; margin:0; font-weight:600;}
  .user-box{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text-muted);}
  .logout-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-muted);
    padding:6px 12px; border-radius:7px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  main{max-width:1180px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:18px;}
  .summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:8px; padding:14px 16px;}
  .stat .n{font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .stat .l{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
  .stat.critical{border-left-color:var(--critical);} .stat.critical .n{color:var(--critical);}
  .stat.warning{border-left-color:var(--warning);} .stat.warning .n{color:var(--warning);}
  .stat.ok{border-left-color:var(--ok);} .stat.ok .n{color:var(--ok);}
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
  .sender-tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:0;}
  .sender-tab{
    padding:9px 16px; font-size:13px; color:var(--text-muted); cursor:pointer;
    border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0;
    background:transparent; margin-bottom:-1px; font-family:'IBM Plex Mono', monospace;
  }
  .sender-tab:hover{color:var(--text);}
  .sender-tab.active{
    color:var(--text); background:var(--panel); border-color:var(--border);
    font-weight:600;
  }
  .chip{display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:20px; border:1px solid var(--border); font-size:12.5px; cursor:pointer; background:var(--panel-2); color:var(--text-muted); user-select:none;}
  .chip .dot{width:7px; height:7px; border-radius:50%;}
  .chip[data-sev="CRITICAL"] .dot{background:var(--critical);}
  .chip[data-sev="WARNING"] .dot{background:var(--warning);}
  .chip[data-sev="OK"] .dot{background:var(--ok);}
  .chip[data-sev="INFO"] .dot{background:var(--info);}
  .chip[data-sev="CRITICAL"].active{background:var(--critical-bg); color:var(--critical); border-color:var(--critical);}
  .chip[data-sev="WARNING"].active{background:var(--warning-bg); color:var(--warning); border-color:var(--warning);}
  .chip[data-sev="OK"].active{background:var(--ok-bg); color:var(--ok); border-color:var(--ok);}
  .chip[data-sev="INFO"].active{background:var(--info-bg); color:var(--info); border-color:var(--info);}
  select, input[type=text], input[type=date]{font-family:inherit; font-size:12.5px; padding:6px 10px; border-radius:7px; border:1px solid var(--border); background:var(--panel-2); color:var(--text);}
  .window-filter{display:flex; align-items:center; gap:8px;}
  .window-filter label{font-size:12.5px; color:var(--text-muted); white-space:nowrap;}
  .window-hint{font-size:11.5px; color:var(--text-faint); white-space:nowrap;}
  .window-hint strong{color:var(--accent); font-weight:700;}
  .spacer{flex:1;}
  .scan-now-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:white;
    background:var(--accent); border:none; border-radius:7px; padding:7px 14px;
    cursor:pointer;
  }
  .scan-now-btn:hover{filter:brightness(1.08);}
  .scan-now-btn:disabled{opacity:0.6; cursor:default;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed;}
  .col-sev{width:92px;}
  .col-time{width:170px;}
  .col-user{width:110px;}
  .col-backupset{width:160px;}
  .col-dest{width:130px;}
  .col-size{width:95px;}
  thead th{text-align:left; font-size:11px; font-weight:600; color:var(--text-faint); padding:10px 14px; border-bottom:1px solid var(--border); background:var(--panel-2); white-space:nowrap;}
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{color:var(--text);}
  .sort-arrow{font-size:10px;}
  .group-header-row td{
    background:var(--panel-2); font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    font-weight:600; color:var(--text-muted); padding:8px 14px; border-bottom:1px solid var(--border);
  }
  .day-header-row td{
    background:var(--warning-bg); font-family:'IBM Plex Mono', monospace; font-size:11px;
    font-weight:600; color:var(--warning); padding:6px 14px 6px 28px; border-bottom:1px solid var(--border);
  }
  .group-count{font-weight:400; color:var(--text-faint);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  tbody td{padding:11px 14px; vertical-align:top;}
  .sev-label{font-size:11px; font-weight:600; padding:2px 8px; border-radius:5px; white-space:nowrap;}
  .sev-label.CRITICAL{background:var(--critical-bg); color:var(--critical);}
  .sev-label.WARNING{background:var(--warning-bg); color:var(--warning);}
  .sev-label.OK{background:var(--ok-bg); color:var(--ok);}
  .sev-label.INFO{background:var(--info-bg); color:var(--info);}
  .cell-time,.cell-dest,.cell-size{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cell-user{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cell-status{color:var(--text-muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cell-backupset{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .report-row{cursor:pointer;}
  .expand-caret{display:inline-block; width:12px; color:var(--text-faint); font-size:10px;}
  .detail-row td{background:var(--panel-2); padding:14px 20px; border-bottom:1px solid var(--border);}
  .detail-grid{display:grid; grid-template-columns:auto minmax(0, 1fr); gap:6px 16px; margin:0;}
  .detail-grid dt{font-size:11px; color:var(--text-faint); white-space:nowrap;}
  .detail-grid dd{margin:0; font-size:12.5px; color:var(--text); overflow-wrap:anywhere; word-break:break-word; min-width:0;}
  .detail-grid dd.mono{font-family:'IBM Plex Mono', monospace; font-size:12px;}
  .log-excerpt{margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .log-excerpt-label{font-size:11px; color:var(--text-faint); margin-bottom:6px;}
  .log-excerpt pre{
    margin:0; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--text-muted);
    background:var(--panel-2); border-radius:6px; padding:10px 12px; max-width:100%;
    max-height:220px; overflow-y:auto; overflow-x:hidden; white-space:pre-wrap;
    word-break:break-word; overflow-wrap:anywhere;
  }
  .log-excerpt.CRITICAL pre{color:var(--critical); background:var(--critical-bg);}
  .log-excerpt.WARNING pre{color:var(--warning); background:var(--warning-bg);}
  .log-excerpt.OK pre{color:var(--ok); background:var(--ok-bg);}
  .empty-state{padding:50px 20px; text-align:center; color:var(--text-faint);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">BM</div>
    <h1>Report backup</h1>
  </div>
  <div class="user-box">
    <span>{{ username }}</span>
    {% if is_admin %}
      <a href="{{ url_for('admin_users') }}" class="logout-btn" style="text-decoration:none;">Utenti</a>
    {% endif %}
    <form method="post" action="{{ url_for('logout') }}" style="margin:0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="logout-btn">Esci</button>
    </form>
  </div>
</header>

<main>
  <div class="sender-tabs" id="senderTabs"></div>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <div class="chip active" data-sev="CRITICAL">Critico <span class="dot"></span></div>
    <div class="chip active" data-sev="WARNING">Attenzione <span class="dot"></span></div>
    <div class="chip active" data-sev="OK">OK <span class="dot"></span></div>
    <div class="chip active" data-sev="INFO">Info <span class="dot"></span></div>
    <select id="destFilter"><option value="">Tutte le destinazioni</option></select>
    <input type="text" id="searchBox" placeholder="Cerca utente o backup set…" />
    <div class="window-filter">
      <label for="windowDateFilter">Notte del</label>
      <input type="date" id="windowDateFilter" />
      <span id="windowHint" class="window-hint"></span>
    </div>
    <div class="spacer"></div>
    <button id="scanNowBtn" class="scan-now-btn">Avvia scansione ora</button>
  </div>

  <div class="panel">
    <table id="reportTable" style="display:none;">
      <thead>
        <tr id="tableHeadRow">
          <th>Gravità</th><th>Data / ora</th><th>Utente</th><th>Backup set</th>
          <th>Destinazione</th><th>Stato</th><th>Dati</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">Caricamento…</div>
  </div>
</main>

<script>
(function(){
  let allReports = [];
  let activeSevs = new Set(['CRITICAL','WARNING','OK','INFO']);
  let activeSender = '';
  let currentSenders = [];
  let sortDir = 'desc'; // 'desc' = più recenti prima, 'asc' = più vecchi prima
  let expandedKeys = new Set();

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const sev = chip.dataset.sev;
      if(activeSevs.has(sev)){ activeSevs.delete(sev); chip.classList.remove('active'); }
      else{ activeSevs.add(sev); chip.classList.add('active'); }
      render();
    });
  });
  document.getElementById('destFilter').addEventListener('change', render);
  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('windowDateFilter').addEventListener('change', render);

  // Computes the "notte" (backup night) window for a given YYYY-MM-DD
  // calendar date: 13:00 on the day BEFORE it, through 06:00 on the
  // date itself - e.g. selecting 23/09 covers 22/09 13:00 -> 23/09 06:00,
  // matching when overnight backup jobs actually run.
  function windowBounds(dateStr){
    const selected = new Date(dateStr + 'T00:00:00');
    const start = new Date(selected);
    start.setDate(start.getDate() - 1);
    start.setHours(13, 0, 0, 0);
    const end = new Date(selected);
    end.setHours(6, 0, 0, 0);
    return {start, end};
  }

  document.getElementById('scanNowBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('scanNowBtn');
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Scansione avviata…';
    try{
      const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
      await fetch('/api/scan-now', {
        method:'POST', credentials:'same-origin',
        headers:{'X-CSRFToken': csrfToken},
      });
    }catch(e){
      // ignore - the button re-enabling below still gives the person a
      // clear "something happened" signal either way
    }
    // Give the poller a little time to actually connect and start
    // processing before refreshing, then restore the button.
    setTimeout(()=>{
      load();
      btn.disabled = false;
      btn.textContent = originalText;
    }, 8000);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sevLabelIt(sev){ return {CRITICAL:'Critico', WARNING:'Attenzione', OK:'OK', INFO:'Info'}[sev]; }
  function truncate(s,n){ s=s||''; return s.length>n ? s.slice(0,n-1)+'…' : s; }
  function formatTs(ts){
    if(!ts) return '—';
    const d = new Date(ts);
    if(isNaN(d.getTime())) return ts;
    return d.toLocaleString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }

  async function load(){
    const url = activeSender ? `/api/reports?sender=${encodeURIComponent(activeSender)}` : '/api/reports';
    const res = await fetch(url, {credentials:'same-origin'});
    if(res.status === 401 || res.redirected){ window.location.href = '/login'; return; }
    const data = await res.json();
    allReports = data.reports || [];
    renderSenderTabs(data.senders || []);
    renderSummary(data.summary || {});
    renderDestinations(data.destinations || []);
    render();
  }

  function renderSenderTabs(senders){
    currentSenders = senders;
    if(senders.length <= 1){
      document.getElementById('senderTabs').innerHTML = '';
      return;
    }
    const tabs = [{value:'', label:'Tutti'}].concat(senders.map(s=>({value:s, label:s})));
    document.getElementById('senderTabs').innerHTML = tabs.map(t => `
      <div class="sender-tab ${t.value === activeSender ? 'active' : ''}" data-sender="${escapeHtml(t.value)}">${escapeHtml(t.label)}</div>
    `).join('');
    document.querySelectorAll('.sender-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        activeSender = tab.dataset.sender;
        load();
      });
    });
  }

  function renderSummary(summary){
    document.getElementById('summary').innerHTML = `
      <div class="stat total"><div class="n">${allReports.length}</div><div class="l">Report totali</div></div>
      <div class="stat critical"><div class="n">${summary.CRITICAL||0}</div><div class="l">Critici</div></div>
      <div class="stat warning"><div class="n">${summary.WARNING||0}</div><div class="l">Attenzione</div></div>
      <div class="stat ok"><div class="n">${summary.OK||0}</div><div class="l">OK</div></div>
    `;
  }
  function renderDestinations(destinations){
    const sel = document.getElementById('destFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">Tutte le destinazioni</option>' +
      destinations.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
    sel.value = destinations.includes(current) ? current : '';
  }

  function render(){
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const destVal = document.getElementById('destFilter').value;
    const windowDateVal = document.getElementById('windowDateFilter').value;
    let windowRange = null;
    if(windowDateVal){
      windowRange = windowBounds(windowDateVal);
    }
    const filtered = allReports.filter(r=>{
      if(!activeSevs.has(r.severity)) return false;
      if(destVal && r.destination !== destVal) return false;
      if(q && !((r.user||'').toLowerCase().includes(q) || (r.backup_set||'').toLowerCase().includes(q))) return false;
      if(windowRange){
        if(!r.timestamp) return false;
        const d = new Date(r.timestamp);
        if(isNaN(d.getTime()) || d < windowRange.start || d > windowRange.end) return false;
      }
      return true;
    });
    const dir = sortDir === 'asc' ? 1 : -1;
    filtered.sort((a,b)=> dir * (new Date(a.timestamp||0) - new Date(b.timestamp||0)));

    const windowHint = document.getElementById('windowHint');
    if(windowRange){
      const distinctAgents = new Set(filtered.map(r=>r.user || '—')).size;
      const fmt = d => d.toLocaleString('it-IT', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      windowHint.innerHTML = `${fmt(windowRange.start)} → ${fmt(windowRange.end)} · <strong>${distinctAgents}</strong> client${distinctAgents===1?'':'i'} distinti`;
    } else {
      windowHint.textContent = '';
    }

    const headRow = document.getElementById('tableHeadRow');
    headRow.innerHTML = '<th class="col-sev">Gravità</th>' +
      `<th class="sortable col-time" id="dateHeader">Data / ora <span class="sort-arrow">${sortDir === 'desc' ? '▾' : '▴'}</span></th>` +
      '<th class="col-user">Utente</th>' +
      '<th class="col-backupset">Backup set</th><th class="col-dest">Destinazione</th><th class="col-status">Stato</th><th class="col-size">Dati</th>';
    document.getElementById('dateHeader').addEventListener('click', ()=>{
      sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      render();
    });

    const table = document.getElementById('reportTable');
    const empty = document.getElementById('emptyState');
    if(filtered.length === 0){
      table.style.display = 'none';
      empty.style.display = 'block';
      empty.textContent = allReports.length ? 'Nessun report corrisponde ai filtri.' : 'Nessun report ricevuto finora.';
      return;
    }
    table.style.display = 'table';
    empty.style.display = 'none';

    const colCount = 7; // Gravità, Data/ora, Utente, Backup set, Destinazione, Stato, Dati

    function rowHtml(r){
      const key = r.natural_key;
      const isOpen = expandedKeys.has(key);
      let html = `
        <tr class="report-row" data-key="${escapeHtml(key)}">
          <td><span class="sev-label ${r.severity}">${sevLabelIt(r.severity)}</span></td>
          <td class="cell-time">${escapeHtml(formatTs(r.timestamp))}</td>
          <td class="cell-user">${escapeHtml(r.user||'—')}</td>
          <td class="cell-backupset">${escapeHtml(r.backup_set||'—')}</td>
          <td class="cell-dest">${escapeHtml(r.destination||'—')}</td>
          <td class="cell-status">
            <span class="expand-caret">${isOpen ? '▾' : '▸'}</span>
            ${escapeHtml(truncate(r.status,80))}
          </td>
          <td class="cell-size">${escapeHtml(r.data_size||'—')}</td>
        </tr>
      `;
      if(isOpen){
        html += `
          <tr class="detail-row" data-key="${escapeHtml(key)}">
            <td colspan="${colCount}">
              <dl class="detail-grid">
                <dt>Stato completo</dt><dd>${escapeHtml(r.status||'—')}</dd>
                <dt>Mittente</dt><dd class="mono">${escapeHtml(r.sender||'—')}</dd>
                <dt>Periodo</dt><dd class="mono">${escapeHtml(r.start_end||'—')}</dd>
                <dt>Indirizzo IP</dt><dd class="mono">${escapeHtml(r.ip_address||'—')}</dd>
                <dt>Job ID</dt><dd class="mono">${escapeHtml(r.job_id||'—')}</dd>
                <dt>Sorgente</dt><dd>${escapeHtml(r.source||'—')}</dd>
              </dl>
              ${r.log_excerpt ? `
                <div class="log-excerpt ${r.severity}">
                  <div class="log-excerpt-label">Dettagli aggiuntivi</div>
                  <pre>${escapeHtml(r.log_excerpt)}</pre>
                </div>
              ` : ''}
            </td>
          </tr>
        `;
      }
      return html;
    }

    // Grouped by Data, then by Utente within each day: for a given date
    // you see every customer's reports clustered together, in the order
    // the data itself already came in (respecting the current date sort
    // direction) rather than by an alphabetical date-string sort.
    function dayKey(r){
      if(!r.timestamp) return '—';
      const d = new Date(r.timestamp);
      if(isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric'});
    }

    const dayGroups = new Map();
    const dayOrder = [];
    for(const r of filtered){
      const dKey = dayKey(r);
      if(!dayGroups.has(dKey)){ dayGroups.set(dKey, []); dayOrder.push(dKey); }
      dayGroups.get(dKey).push(r);
    }

    document.getElementById('tableBody').innerHTML = dayOrder.map(dKey => {
      const dayRows = dayGroups.get(dKey);
      // Sub-group by user within this day, alphabetically.
      const userGroups = new Map();
      for(const r of dayRows){
        const uKey = r.user || '—';
        if(!userGroups.has(uKey)) userGroups.set(uKey, []);
        userGroups.get(uKey).push(r);
      }
      const userKeys = Array.from(userGroups.keys()).sort((a,b)=> a.localeCompare(b));
      const usersHtml = userKeys.map(user => {
        const userRows = userGroups.get(user);
        const userHeader = userRows.length > 1
          ? `<tr class="day-header-row"><td colspan="${colCount}">${escapeHtml(user)} <span class="group-count">(${userRows.length} notifiche)</span></td></tr>`
          : `<tr class="day-header-row"><td colspan="${colCount}">${escapeHtml(user)}</td></tr>`;
        return userHeader + userRows.map(rowHtml).join('');
      }).join('');
      return `
        <tr class="group-header-row">
          <td colspan="${colCount}">${escapeHtml(dKey)} <span class="group-count">(${dayRows.length})</span></td>
        </tr>
        ${usersHtml}
      `;
    }).join('');
  }

  // Delegated click handler: attached once to the (persistent) tableBody
  // container, so it keeps working after every render() replaces its
  // innerHTML (re-attaching a listener to each row every render would
  // also work, but this is simpler and cheaper).
  document.getElementById('tableBody').addEventListener('click', (e)=>{
    const row = e.target.closest('.report-row');
    if(!row) return;
    const key = row.dataset.key;
    if(expandedKeys.has(key)) expandedKeys.delete(key);
    else expandedKeys.add(key);
    render();
  });

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
