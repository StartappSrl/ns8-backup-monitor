<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accedi — Backup Monitor</title>
<style>
  :root{
    --bg:#12161D; --panel:#1A2029; --border:#2A313D; --text:#E7ECF2;
    --text-muted:#9AA4B2; --accent:#6C97F5; --error:#F0555C; --error-bg:#3A1E20;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'IBM Plex Sans', Arial, sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:32px 28px;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .brand-mark{
    width:32px; height:32px; border-radius:7px;
    background:linear-gradient(135deg, var(--accent), #7756D9);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:700; font-size:14px; flex-shrink:0;
  }
  .brand h1{font-size:15px; margin:0; font-weight:600;}
  label{display:block; font-size:12.5px; color:var(--text-muted); margin:16px 0 6px;}
  input{
    width:100%; padding:10px 12px; border-radius:7px;
    border:1px solid var(--border); background:#0F1319; color:var(--text);
    font-size:14px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--accent);}
  button{
    width:100%; margin-top:22px; padding:10px; border:none; border-radius:7px;
    background:var(--accent); color:#0B0E13; font-weight:600; font-size:14px;
    cursor:pointer;
  }
  button:hover{opacity:0.92;}
  .error{
    margin-top:16px; padding:10px 12px; border-radius:7px;
    background:var(--error-bg); color:var(--error); font-size:12.5px;
  }
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:6px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">BM</div>
      <h1>Backup Monitor</h1>
    </div>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Utente</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <label for="totp_code">Codice di verifica (app authenticator)</label>
      <input type="text" id="totp_code" name="totp_code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
      <div class="hint">Il codice a 6 cifre generato dalla tua app di autenticazione</div>

      {% if error == "invalid_credentials" %}
        <div class="error">Utente, password o codice non validi.</div>
      {% elif error == "account_locked" %}
        <div class="error">Troppi tentativi falliti. Riprova tra qualche minuto.</div>
      {% endif %}

      <button type="submit">Accedi</button>
    </form>
  </div>
</body>
</html>
